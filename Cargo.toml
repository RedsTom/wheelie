[package]
name = "wheelie"
version = "0.4.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
authors = ["RedsTom"]
repository = "https://github.com/RedsTom/wheelie"
description = "Cross-platform knob utility with a Windows Wheel-inspired radial UI"

[features]
test-doubles = []

[dependencies]
anyhow = "1"
auto-launch = "0.6"
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
directories = "6"
enigo = "0.6.1"
global-hotkey = "0.10"
gpui-icons = "=0.7.0"
gpui-kit = "=0.10.0"
gpui-pre = "=0.3.12"
gpui-pre-platform = "=0.3.12"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
semver = "1"
serde = { version = "1", features = ["derive"] }
single-instance = "0.3.3"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.24.2"
ureq = { version = "3", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Graphics_Imaging",
    "Media_Control",
    "Storage_Streams",
] }

[build-dependencies]
embed-resource = "3"
