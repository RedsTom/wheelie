[package]
name = "wheelie"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
authors = ["RedsTom"]
repository = "https://github.com/RedsTom/wheelie"
description = "Cross-platform knob utility with a Windows Wheel-inspired radial UI"

[dependencies]
anyhow = "1"
auto-launch = "0.6"
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
directories = "6"
eframe = "0.33.3"
enigo = "0.6.1"
global-hotkey = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
single-instance = "0.3.3"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.24.2"
